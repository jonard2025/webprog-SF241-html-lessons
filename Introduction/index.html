<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio | Portfolio</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<!-- Vue 3 CDN -->
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  font-family: 'Poppins', sans-serif;
  background: #0b0b0b;
  color: #fff;
}

/* LIGHT MODE */
.light {
  background: #f5f5f5;
  color: #111;
}
.light .navbar { background: rgba(255,255,255,0.9); }
.light .card { background: #fff; }

/* NAVBAR */
.navbar {
  position: fixed;
  top: 0;
  width: 100%;
  padding: 25px 80px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(0,0,0,0.85);
  backdrop-filter: blur(8px);
  z-index: 1000;
}

.navbar a {
  margin-left: 25px;
  text-decoration: none;
  color: #aaa;
  font-size: 0.9rem;
}

.navbar a.active,
.navbar a:hover { color: gold; }

.mode-btn {
  margin-left: 20px;
  background: none;
  border: none;
  color: gold;
  cursor: pointer;
  font-size: 0.9rem;
}

/* SECTIONS */
section {
  padding: 120px 80px;
}

h1, h2 { color: gold; }

/* GRID */
.container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px,1fr));
  gap: 40px;
  align-items: center;
}

/* ABOUT */
.about-box {
  background: rgba(255,255,255,0.1);
  border-left: 4px solid gold;
  padding: 30px;
  border-radius: 15px;
  backdrop-filter: blur(8px);
}

/* IMAGE */
.hero-image img {
  width: 320px;
  border-radius: 50%;
  box-shadow: 0 0 120px rgba(255,215,0,0.6);
  display: block;
  margin: auto;
}

/* CARDS */
.card {
  background: #111;
  padding: 20px;
  border-radius: 15px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.4);
  transition: transform 0.3s;
  cursor: pointer;
}
.card:hover { transform: translateY(-5px); }

.card img {
  width: 100%;
  border-radius: 10px;
  margin-bottom: 10px;
}

/* MODAL */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 2000;
}
.modal img {
  max-width: 90%;
  max-height: 90%;
  border-radius: 15px;
}

/* TRANSITION */
.fade-enter-active, .fade-leave-active {
  transition: opacity 0.6s ease;
}
.fade-enter-from, .fade-leave-to {
  opacity: 0;
}

/* MOBILE */
@media (max-width: 768px) {
  section { padding: 100px 20px; }
  .navbar { padding: 20px; }
}
</style>
</head>

<body>
<div id="app" :class="{light: !dark}">

<!-- NAVBAR -->
<header class="navbar">
  <strong>PORTFOLIO</strong>
  <nav>
    <a href="#home" :class="{active: active==='home'}">Home</a>
    <a href="#gallery" :class="{active: active==='gallery'}">Gallery</a>
    <a href="#projects" :class="{active: active==='projects'}">Projects</a>
    <a href="#contact" :class="{active: active==='contact'}">Contact</a>
    <button class="mode-btn" @click="dark=!dark">
      {{ dark ? '☀ Light' : '🌙 Dark' }}
    </button>
  </nav>
</header>

<!-- HOME -->
<section id="home">
  <div class="container">
    <div class="about-box">
      <p><strong>HELLO — I’M</strong></p>
      <h1>{{ profile.name }}</h1>
      <p>{{ profile.tagline }}</p>
      <p>{{ profile.roles }}</p>
    </div>
    <div class="hero-image">
      <img :src="'https://github.com/jonard2025/webprog-SF241-html-lessons/blob/main/Screenshot%202026-01-09%20150654.png?raw=true'" alt="Screenshot">
    </div>
  </div>
</section>

<!-- GALLERY -->
<transition name="fade">
<section id="gallery">
  <h2>Gallery</h2>
  <div class="container">
    <div class="card" v-for="item in gallery" :key="item.title"
         @click="modalImage=item.image">
      <img :src="item.image">
      <p>{{ item.title }}</p>
    </div>
  </div>
</section>
</transition>

<!-- PROJECTS -->
<transition name="fade">
<section id="projects">
  <h2>Projects</h2>
  <div class="container">
    <div class="card" v-for="p in projects" :key="p.name">
      <h3>{{ p.name }}</h3>
      <p>{{ p.description }}</p>
    </div>
  </div>
</section>
</transition>

<!-- CONTACT -->
<transition name="fade">
<section id="contact">
  <h2>Contact</h2>
  <p>Email: {{ contact.email }}</p>
  <p>GitHub: {{ contact.github }}</p>
  <p>LinkedIn: {{ contact.linkedin }}</p>
</section>
</transition>

<!-- MODAL -->
<div v-if="modalImage" class="modal" @click="modalImage=null">
  <img :src="modalImage">
</div>

</div>

<!-- VUE SCRIPT -->
<script>
const { createApp } = Vue;

createApp({
  data() {
    return {
      dark: true,
      active: 'home',
      modalImage: null,

      profile: {
        name: 'Jonard Bacani',
        tagline: 'Curious by nature. Cyber-driven by passion.',
        roles: 'CYBERSECURITY • WEB • STUDENT',
        photo: 'your-photo.png'
      },

      gallery: [
        { title: 'Adventure', image: 'https://github.com/jonard2025/webprog-SF241-html-lessons/blob/main/449180710_18363982216100360_536621986824455376_n.jpg?raw=true'},
        { title: 'Confidence', image: 'https://github.com/jonard2025/webprog-SF241-html-lessons/blob/main/541006934_18428081827100360_4760799111197846190_n.jpg?raw=true' },
        { title: 'Creativity', image: 'https://github.com/jonard2025/webprog-SF241-html-lessons/blob/main/471586028_18392143615100360_8376085231183085146_n.jpg?raw=true' }        
      ],

      projects: [
        { name: '“The Moment the Earth Trembled” by Jonard Javier ', description: '“The Moment the Earth Trembled” by Jonard Javier A gripping and deeply emotional coming-of-age narrative, The Moment the Earth Trembled chronicles the life of Alexis Markius, a young man navigating a world of fear, trauma, and self-discovery. From the suffocating weight of an abusive father to the quiet strength of a devoted mother, Alexis learns early that life is as cruel as it is unpredictable. Amid heartbreak, fleeting joys, and forbidden desires, he struggles to uncover his true identity and confront the truths he has long hidden from himself. Against the backdrop of a vibrant yet unforgiving world, Alexis embarks on a journey of love, loss, and resilience, discovering that even in the darkest tremors of life, hope can take root. A story of pain, passion, and perseverance, it captures the fragile beauty of human connection and the courage it takes to embrace one’s authentic self.' },
        { name: 'PawCare App', description: 'Responsible pet ownership app aligned with SDG 16.' }
      ],

      contact: {
        email: 'jonard20javier@gmail.com',
        github: 'github.com/jonard',
        linkedin: 'linkedin.com/in/jonard'
      }
    }
  },
  mounted() {
    window.addEventListener('scroll', this.onScroll);
  },
  methods: {
    onScroll() {
      const ids = ['home','gallery','projects','contact'];
      for (let id of ids) {
        const el = document.getElementById(id);
        const rect = el.getBoundingClientRect();
        if (rect.top <= 150 && rect.bottom >= 150) {
          this.active = id;
        }
      }
    }
  }
}).mount('#app');
</script>

</body>
</html>
